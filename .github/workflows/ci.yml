name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

# NOTE ON JOB DEPENDENCIES
#
# `test`, `test-pqc` and `wasm` deliberately do NOT declare `needs: check`.
# They used to. The result was that when `cargo fmt --check` broke in
# 0d23249, every downstream job reported as *skipped* rather than failed, and
# a real regression in pepper_required enforcement sat undetected on main from
# 2026-03-02 to 2026-09-16. A formatting nit must never be able to silence the
# test suite. See CI-RESULTS.md.
jobs:
  check:
    name: Check, Lint, Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: cargo fmt --check
        run: cargo fmt --check

      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo clippy (pqc)
        run: cargo clippy --all-targets --features pqc -- -D warnings

      - name: cargo build
        run: cargo build --release

  test:
    name: Rust Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # --no-fail-fast so one failing suite does not hide failures in the rest.
      - name: cargo test
        run: cargo test --no-fail-fast -- --test-threads=2

  test-pqc:
    name: Rust Tests (pqc feature)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # The pqc feature was entirely unbuilt by CI until 2026-09-16, and had
      # drifted into not compiling at all (cfg-gated struct fields) on top of a
      # broken end-to-end roundtrip. It gets its own job so that cannot recur.
      - name: cargo test --features pqc
        run: cargo test --features pqc --no-fail-fast -- --test-threads=2

  wasm:
    name: WASM Build + Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Build WASM
        run: wasm-pack build snow2_wasm --target web --out-dir ../web_demo/pkg

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run WASM tests
        run: node web_demo/test_wasm.mjs

      - name: Run download/upload tests
        run: node web_demo/test_download_upload.mjs

      # stress_test.mjs is where the chi-squared and line-coverage figures
      # quoted in the README originate. It was never run by CI, so those
      # numbers were unverifiable. The same properties are now also asserted
      # in tests/steganalysis.rs, which the `test` job runs.
      - name: Run stego stress test
        run: node web_demo/stress_test.mjs
